# Unsigned Windows NSIS + macOS DMGs + Linux deb/rpm/AppImage + Android APK + iOS IPA on v* tags.
# workflow_dispatch: rebuild the chosen artifacts from this ref and replace
# same-named files on an existing tag (does not retag).
# Keep run: | bodies indented — a flush-left line inside a Mac step
# made GitHub reject the whole file (0-job failure on every main push).
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      attach_tag:
        description: 'Existing GitHub release tag for the selected artifacts (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'
        type: string
      targets:
        description: 'Which builds to make and attach'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - phone
          - windows-x64
          - android
          - windows-arm64
          - linux

permissions:
  contents: read

jobs:
  release:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'desktop' || github.event.inputs.targets == 'windows-x64'))
    # Electron 28's GPU and renderer processes crash with an access violation on the
    # 2026-10-21 windows-2025 image (windows-latest); the Windows 11 ARM64 image is unaffected.
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci
      - name: Make NSIS Setup
        env:
          # Unset secrets arrive as ""; make-win.js strips blanks so signing is skipped.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run make:win
      - name: Locate Setup.exe
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File "out\make" -Filter "Phevere-Setup-*-x64.exe" |
            Select-Object -First 1
          if (-not $exe) { throw 'Phevere-Setup-*-x64.exe not found under out\make' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($exe.Name)"
          Write-Host "Found $($exe.FullName)"
      - name: Verify in-place Windows upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
        shell: pwsh
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP 'phevere-previous-installer'
          New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
          gh release download $env:TAG --pattern 'Phevere-Setup-*-x64.exe' --dir $previousDir --clobber
          if ($LASTEXITCODE -ne 0) {
            # A new release has no installer yet: upgrade from the newest earlier release that has one.
            $earlier = gh release list --limit 20 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' | Where-Object { $_ -ne $env:TAG }
            foreach ($t in $earlier) {
              gh release download $t --pattern 'Phevere-Setup-*-x64.exe' --dir $previousDir --clobber
              if ($LASTEXITCODE -eq 0) { Write-Host "Upgrade check starts from $t"; break }
            }
          }
          if (-not (Get-ChildItem -LiteralPath $previousDir -Filter '*.exe') -and '${{ github.event_name }}' -eq 'workflow_dispatch') { throw 'Could not download an earlier x64 installer for the upgrade check.' }
          $global:LASTEXITCODE = 0
          $previous = Get-ChildItem -LiteralPath $previousDir -Filter '*.exe' | Select-Object -First 1
          if ($previous) {
            ./scripts/test-installer-upgrade.ps1 -Installer '${{ steps.pkg.outputs.exe }}' -PreviousInstaller $previous.FullName
          } else {
            ./scripts/test-installer-upgrade.ps1 -Installer '${{ steps.pkg.outputs.exe }}'
          }
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: ./scripts/gh-delete-release-asset.ps1
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.exe }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
      - name: Attest Setup.exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.exe }}

  release-win-arm64:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'desktop' || github.event.inputs.targets == 'windows-arm64'))
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci
      - name: Make NSIS Setup (arm64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run make:win:arm64
      - name: Locate ARM64 Setup.exe
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File "out\make" -Filter "Phevere-Setup-*-arm64.exe" |
            Select-Object -First 1
          if (-not $exe) { throw 'Phevere-Setup-*-arm64.exe not found under out\make' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($exe.Name)"
          Write-Host "Found $($exe.FullName)"
      - name: Verify in-place Windows ARM64 upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
        shell: pwsh
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP 'phevere-previous-installer'
          New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
          gh release download $env:TAG --pattern 'Phevere-Setup-*-arm64.exe' --dir $previousDir --clobber
          if ($LASTEXITCODE -ne 0) {
            # A new release has no installer yet: upgrade from the newest earlier release that has one.
            $earlier = gh release list --limit 20 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' | Where-Object { $_ -ne $env:TAG }
            foreach ($t in $earlier) {
              gh release download $t --pattern 'Phevere-Setup-*-arm64.exe' --dir $previousDir --clobber
              if ($LASTEXITCODE -eq 0) { Write-Host "Upgrade check starts from $t"; break }
            }
          }
          if (-not (Get-ChildItem -LiteralPath $previousDir -Filter '*.exe') -and '${{ github.event_name }}' -eq 'workflow_dispatch') { throw 'Could not download an earlier ARM64 installer for the upgrade check.' }
          $global:LASTEXITCODE = 0
          $previous = Get-ChildItem -LiteralPath $previousDir -Filter '*.exe' | Select-Object -First 1
          if ($previous) {
            ./scripts/test-installer-upgrade.ps1 -Installer '${{ steps.pkg.outputs.exe }}' -PreviousInstaller $previous.FullName
          } else {
            ./scripts/test-installer-upgrade.ps1 -Installer '${{ steps.pkg.outputs.exe }}'
          }
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: ./scripts/gh-delete-release-asset.ps1
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.exe }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest Setup.exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.exe }}

  release-mac:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'desktop'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_arch: arm64
          - os: macos-15-intel
            electron_arch: x64
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes AX native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm ci
      - name: Make unsigned DMG (${{ matrix.electron_arch }})
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: "npm run make:mac:${{ matrix.electron_arch }}"
      - name: Locate DMG
        id: pkg
        shell: bash
        run: |
          shopt -s nullglob
          files=(out/make/dmg/Phevere-*-darwin-${{ matrix.electron_arch }}.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Phevere-*-darwin-${{ matrix.electron_arch }}.dmg not found under out/make/dmg" >&2
            exit 1
          fi
          echo "dmg=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"
          echo "Found ${files[0]}"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: ./scripts/gh-delete-release-asset.ps1
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.dmg }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest DMG
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.dmg }}

  # deb, rpm and AppImage per arch. Ubuntu 22.04 (glibc 2.35) for the widest reach.
  release-linux:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'desktop' || github.event.inputs.targets == 'linux'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            electron_arch: x64
          - os: ubuntu-22.04-arm
            electron_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install packaging tools and addon libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxfixes-dev \
            libatspi2.0-dev libglib2.0-dev libwayland-dev fakeroot dpkg rpm squashfs-tools
      - name: Install (includes Linux selection addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Make deb, rpm and AppImage (${{ matrix.electron_arch }})
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: "npm run make:linux:${{ matrix.electron_arch }}"
      - name: Locate packages
        id: pkg
        shell: bash
        run: |
          shopt -s nullglob
          files=(out/make/deb/*/*.deb out/make/rpm/*/*.rpm out/make/AppImage/*/*.AppImage)
          if [ ${#files[@]} -ne 3 ]; then
            echo "expected one deb, one rpm and one AppImage, found: ${files[*]}" >&2
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Found %s\n' "${files[@]}"
      - name: Remove existing assets with the same names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          FILES: ${{ steps.pkg.outputs.files }}
        shell: bash
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] && ASSET="$(basename "$f")" pwsh ./scripts/gh-delete-release-asset.ps1
          done <<< "$FILES"
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.files }}

  # Release APKs require a persistent signing identity. CI remains debug-signed.
  # The IPA is unsigned. The emulator test stays in ci.yml.
  release-android:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'phone' || github.event.inputs.targets == 'android'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the APK versionCode counts commits
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: node scripts/prepare-android-signing.js
      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true
          yes | "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null || true
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
      - name: Install JS deps and sync phone UI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          node scripts/test-mobile-regressions.js
          node scripts/test-android-release.js
          npm run mobile:sync
      - name: Bundle mechanical speech
        working-directory: apps/mobile
        run: |
          python scripts/prepare-speech.py
          python scripts/test-speech-package.py
      - name: Build Android APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/phevere-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          python ../scripts/check-apk-16kb.py app/build/outputs/apk/release/app-release.apk
      - name: Remove temporary signing material
        if: always() && steps.signing.outcome == 'success'
        run: rm -f -- "$RUNNER_TEMP/phevere-release.jks"
      - name: Name APK
        id: pkg
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          NAME="Phevere-${VERSION}-android.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "file=$PWD/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Verify signing identity and preserve previous APK
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          APK: ${{ steps.pkg.outputs.file }}
          ASSET: ${{ steps.pkg.outputs.name }}
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          IS_REPLACEMENT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-apk-certificate.txt"
          ACTUAL_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-apk-certificate.txt")"
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/new-apk-certificate.txt")" = 1
          test "${ACTUAL_SHA256,,}" = "${EXPECTED_SHA256,,}"
          if [ "$IS_REPLACEMENT" = true ]; then
            mkdir -p "$RUNNER_TEMP/android-rollback"
            gh release view "$TAG" --json assets,tagName,targetCommitish > "$RUNNER_TEMP/android-rollback/release.json"
            jq -r '.assets[].name' "$RUNNER_TEMP/android-rollback/release.json" > "$RUNNER_TEMP/asset-names.txt"
            if grep -Fxq -- "$ASSET" "$RUNNER_TEMP/asset-names.txt"; then
              gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/android-rollback"
              "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/android-rollback/$ASSET" > "$RUNNER_TEMP/previous-apk-certificate.txt"
              PREVIOUS_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-apk-certificate.txt")"
              test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/previous-apk-certificate.txt")" = 1
              if [ "${PREVIOUS_SHA256,,}" != "${ACTUAL_SHA256,,}" ]; then
                echo 'Refusing replacement: the published APK uses a different signing identity.' >&2
                exit 1
              fi
              (cd "$RUNNER_TEMP/android-rollback" && sha256sum "$ASSET" > SHA256SUMS)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Retain Android rollback copy
        if: steps.previous.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-rollback/
          retention-days: 30
          if-no-files-found: error
      - name: Find the previous signed release APK
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          mkdir -p "$RUNNER_TEMP/baseline"
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$TAG" ] && continue
            name="$(gh release view "$tag" --json assets -q '.assets[].name' | grep -E '^Phevere-.*-android\.apk$' | head -1 || true)"
            [ -n "$name" ] || continue
            gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/baseline" --clobber
            sha="$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/baseline/$name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [ "${sha,,}" = "${EXPECTED_SHA256,,}" ]; then
              echo "apk=$RUNNER_TEMP/baseline/$name" >> "$GITHUB_OUTPUT"
              echo "Upgrade baseline: $tag ($name)"
              exit 0
            fi
            rm -f "$RUNNER_TEMP/baseline/$name"
          done
          echo "::warning::No earlier release APK carries the approved certificate; skipping the upgrade test."
      - name: Enable emulator acceleration
        if: steps.baseline.outputs.apk != ''
        run: sudo chmod 666 /dev/kvm
      - name: Upgrade the previous release in place on an emulator
        if: steps.baseline.outputs.apk != ''
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-android-upgrade.sh "${{ steps.baseline.outputs.apk }}" "${{ steps.pkg.outputs.file }}"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: ./scripts/gh-delete-release-asset.ps1
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.file }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.file }}

  release-ios:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.targets == 'all' || github.event.inputs.targets == 'phone'))
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the build number counts commits
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install JS deps and sync phone UI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run mobile:sync
      - name: Build iOS app
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install
            PROJECT_ARGS=(-workspace App.xcworkspace)
          else
            PROJECT_ARGS=(-project App.xcodeproj)
          fi
          xcodebuild \
            "${PROJECT_ARGS[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build
      - name: Package IPA
        id: pkg
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          NAME="Phevere-${VERSION}-ios-unsigned.ipa"
          APP="$PWD/apps/mobile/ios/App/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          ditto "$APP" ipa/Payload/App.app
          (cd ipa && zip -qry "../$NAME" Payload)
          echo "file=$PWD/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: ./scripts/gh-delete-release-asset.ps1
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.file }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest IPA
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.file }}
