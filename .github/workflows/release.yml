# Unsigned Windows NSIS + macOS DMGs on v* tags.
# workflow_dispatch: rebuild all four artifacts from this ref and replace
# same-named files on an existing tag (does not retag).
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      attach_tag:
        description: 'Existing GitHub release tag to replace Win x64/ARM64 Setup + Mac x64/arm64 DMG (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        run: npm ci
      - name: Make NSIS Setup
        env:
          # Unset secrets arrive as ""; make-win.js strips blanks so signing is skipped.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run make:win
      - name: Locate Setup.exe
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File "out\make" -Filter "Phevere-Setup-*-x64.exe" |
            Select-Object -First 1
          if (-not $exe) { throw 'Phevere-Setup-*-x64.exe not found under out\make' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($exe.Name)"
          Write-Host "Found $($exe.FullName)"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: |
          $relJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No release yet for $env:TAG"
            exit 0
          }
          $rel = $relJson | ConvertFrom-Json
          $hit = @($rel.assets) | Where-Object { $_.name -eq $env:ASSET } | Select-Object -First 1
          if ($hit) {
            Write-Host "Deleting existing $($hit.name) id=$($hit.id)"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($hit.id)"
          } else {
            Write-Host "No existing asset named $env:ASSET"
          }
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.exe }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
      - name: Attest Setup.exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.exe }}

  release-win-arm64:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        run: npm ci
      - name: Make NSIS Setup (arm64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run make:win
      - name: Locate ARM64 Setup.exe
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File "out\make" -Filter "Phevere-Setup-*-arm64.exe" |
            Select-Object -First 1
          if (-not $exe) { throw 'Phevere-Setup-*-arm64.exe not found under out\make' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($exe.Name)"
          Write-Host "Found $($exe.FullName)"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        shell: pwsh
        run: |
          $relJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No release yet for $env:TAG"
            exit 0
          }
          $rel = $relJson | ConvertFrom-Json
          $hit = @($rel.assets) | Where-Object { $_.name -eq $env:ASSET } | Select-Object -First 1
          if ($hit) {
            Write-Host "Deleting existing $($hit.name) id=$($hit.id)"
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($hit.id)"
          } else {
            Write-Host "No existing asset named $env:ASSET"
          }
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.exe }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest Setup.exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.exe }}

  release-mac:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_arch: arm64
          - os: macos-15-intel
            electron_arch: x64
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes AX native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci
      - name: Make unsigned DMG (${{ matrix.electron_arch }})
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm run make:mac:${{ matrix.electron_arch }}
      - name: Locate DMG
        id: pkg
        run: |
          shopt -s nullglob
          files=(out/make/dmg/Phevere-*-darwin-${{ matrix.electron_arch }}.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Phevere-*-darwin-${{ matrix.electron_arch }}.dmg not found under out/make/dmg" >&2
            exit 1
          fi
          echo "dmg=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"
          echo "Found ${files[0]}"
      - name: Remove existing asset with the same name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.name }}
        run: |
          set +e
          json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "No release yet for ${TAG}"
            exit 0
          fi
          id=$(printf '%s' "$json" | python3 -c "import json,os,sys; rel=json.load(sys.stdin); name=os.environ['ASSET'];
hits=[a['id'] for a in rel.get('assets') or [] if a.get('name')==name];
print(hits[0] if hits else '')")
          if [ -n "$id" ]; then
            echo "Deleting existing ${ASSET} id=${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          else
            echo "No existing asset named ${ASSET}"
          fi
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_tag || github.ref_name }}
          files: ${{ steps.pkg.outputs.dmg }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
      - name: Attest DMG
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.dmg }}
