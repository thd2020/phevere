# Unsigned NSIS Setup on v* tags. Optional CSC_LINK / CSC_KEY_PASSWORD repo secrets sign the exe.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        run: npm ci
      - name: Make NSIS Setup
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run make:win
      - name: Locate Setup.exe
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File "out\make" -Filter "Phevere-Setup-*-x64.exe" |
            Select-Object -First 1
          if (-not $exe) { throw 'Phevere-Setup-*-x64.exe not found under out\make' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($exe.Name)"
          Write-Host "Found $($exe.FullName)"
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.pkg.outputs.exe }}
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Attest Setup.exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.pkg.outputs.exe }}
