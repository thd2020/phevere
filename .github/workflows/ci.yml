# Lint/test/build on PR and main. Windows and macOS pack + verify OCR natives.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci
      - name: Package win32 x64 and verify OCR natives
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: pwsh
        run: |
          npx electron-forge package --platform=win32 --arch=x64
          node scripts/verify-ocr-pack.js --dir out/phevere-win32-x64
      - name: Upload unpackaged app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phevere-win32-x64
          path: out/phevere-win32-x64
          if-no-files-found: error
          retention-days: 7

  macos-ocr-pack:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_arch: arm64
          - os: macos-15-intel
            electron_arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (includes AX native addon)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci
      - name: Package darwin (${{ matrix.electron_arch }}) and verify OCR natives
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          npx electron-forge package --platform darwin --arch ${{ matrix.electron_arch }}
          node scripts/verify-ocr-pack.js --dir out/phevere-darwin-${{ matrix.electron_arch }}
      - name: Upload unpackaged app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phevere-darwin-${{ matrix.electron_arch }}
          path: out/phevere-darwin-${{ matrix.electron_arch }}
          if-no-files-found: error
          retention-days: 7

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install JS deps and sync phone UI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run mobile:sync
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phevere-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install JS deps and sync phone UI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run mobile:sync
      - name: Build unsigned iOS app
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install
            PROJECT_ARGS=(-workspace App.xcworkspace)
          else
            PROJECT_ARGS=(-project App.xcodeproj)
          fi
          xcodebuild \
            "${PROJECT_ARGS[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package unsigned IPA
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          ditto "$APP" ipa/Payload/App.app
          (cd ipa && zip -qry ../Phevere.ipa Payload)
      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phevere-ios-unsigned
          path: apps/mobile/ios/App/Phevere.ipa
          if-no-files-found: error
          retention-days: 7
