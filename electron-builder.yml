appId: com.phevere.app
productName: Phevere
copyright: Copyright © 2026 thd2020
directories:
  buildResources: packaging
  output: out/make/nsis
files:
  - '**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
asar: true
asarUnpack:
  - '**/node_modules/koffi/**/*'
  - '**/node_modules/sql.js/**/*'
  - '**/node_modules/onnxruntime-node/**/*'
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/@gutenye/**/*'
extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: scripts/ocr_worker.py
    to: ocr_worker.py
  - from: scripts/media_now_playing.ps1
    to: media_now_playing.ps1
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: node_modules/sql.js/dist/sql-asm.js
    to: sql-asm.js
  - from: resources/seed
    to: seed
  - from: resources/ocr-models
    to: ocr-models
  - from: packaging/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: packaging/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  publisherName: thd2020
nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # Shortcuts are offered as optional components in installer.nsh
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: Phevere
  installerIcon: packaging/icon.ico
  uninstallerIcon: packaging/icon.ico
  installerHeaderIcon: packaging/icon.ico
  installerHeader: packaging/installerHeader.bmp
  installerSidebar: packaging/installerSidebar.bmp
  uninstallerSidebar: packaging/installerSidebar.bmp
  include: packaging/installer.nsh
  license: LICENSE
  runAfterFinish: true
  # false → install under Program Files\Phevere (not Program Files\<author>\Phevere)
  menuCategory: false
  displayLanguageSelector: false
  differentialPackage: false
  uninstallDisplayName: Phevere ${version}
  warningsAsErrors: false
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
