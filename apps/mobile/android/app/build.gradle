apply plugin: 'com.android.application'

// Version: the name comes from apps/mobile/package.json (semver, bumped per release); the
// code is the number of commits on HEAD, so every build from a newer commit installs as an
// upgrade. Debug builds also carry the commit, e.g. 0.2.0-dev.412+8e5f006.
def mobilePackage = new groovy.json.JsonSlurper().parse(file("${rootProject.projectDir}/../package.json"))
def git = { List<String> args ->
    def out = providers.exec {
        commandLine(['git'] + args)
        workingDir rootProject.projectDir
        ignoreExitValue true
    }
    try {
        return out.result.get().exitValue == 0 ? out.standardOutput.asText.get().trim() : ''
    } catch (Exception ignored) {
        return ''  // git missing, e.g. a build from a source archive
    }
}
def commitCount = git(['rev-list', '--count', 'HEAD'])
def commitSha = git(['rev-parse', '--short=7', 'HEAD'])

android {
    namespace "com.phevere.app"
    compileSdk rootProject.ext.compileSdkVersion
    // r28 links 16 KB-aligned ELF segments by default (Android 15+ 16 KB page devices).
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.phevere.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode commitCount.isInteger() ? commitCount.toInteger() : 1
        versionName mobilePackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                // Same switches as espeak-ng's own Android build.
                arguments "-DUSE_ASYNC:BOOL=OFF", "-DUSE_MBROLA:BOOL=OFF", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                targets "ttsespeak"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "${buildDir}/generated/speech-v2/espeak-ng-src/android/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir "${buildDir}/generated/speech-v2/assets"
    buildTypes {
        debug {
            versionNameSuffix "-dev.${commitCount ?: 0}" + (commitSha ? "+${commitSha}" : '')
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation files("${buildDir}/generated/speech-v2/sherpa-onnx-1.13.3.aar")
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly 'de.robv.android.xposed:api:82'
    // Modern LSPosed (libxposed): hook API is provided by the framework; the service
    // library gives the app remote preferences shared privately with the module.
    // 101 (API 101): 102 needs compileSdk 37, i.e. AGP 9.
    compileOnly 'io.github.libxposed:api:101.0.1'
    implementation 'io.github.libxposed:service:101.0.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

def distDir = file("${rootProject.projectDir}/../dist")
tasks.register('syncWebAssets', Copy) {
    from distDir
    into "${projectDir}/src/main/assets/www"
    onlyIf { distDir.exists() }
}
preBuild.dependsOn syncWebAssets

tasks.register('checkBundledSpeech') {
    doLast {
        if (!file("${buildDir}/generated/speech-v2/assets/speech/bundle.json").exists()) {
            throw new GradleException('Run python ../scripts/prepare-speech.py before building Android')
        }
    }
}
preBuild.dependsOn checkBundledSpeech
