apply plugin: 'com.android.application'

android {
    namespace "com.phevere.app"
    compileSdk rootProject.ext.compileSdkVersion
    // r28 links 16 KB-aligned ELF segments by default (Android 15+ 16 KB page devices).
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.phevere.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                // Same switches as espeak-ng's own Android build.
                arguments "-DUSE_ASYNC:BOOL=OFF", "-DUSE_MBROLA:BOOL=OFF", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                targets "ttsespeak"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "${buildDir}/generated/speech-v2/espeak-ng-src/android/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir "${buildDir}/generated/speech-v2/assets"
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation files("${buildDir}/generated/speech-v2/sherpa-onnx-1.13.3.aar")
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly 'de.robv.android.xposed:api:82'
    // Modern LSPosed (libxposed): hook API is provided by the framework; the service
    // library gives the app remote preferences shared privately with the module.
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

def distDir = file("${rootProject.projectDir}/../dist")
tasks.register('syncWebAssets', Copy) {
    from distDir
    into "${projectDir}/src/main/assets/www"
    onlyIf { distDir.exists() }
}
preBuild.dependsOn syncWebAssets

tasks.register('checkBundledSpeech') {
    doLast {
        if (!file("${buildDir}/generated/speech-v2/assets/speech/bundle.json").exists()) {
            throw new GradleException('Run python ../scripts/prepare-speech.py before building Android')
        }
    }
}
preBuild.dependsOn checkBundledSpeech
