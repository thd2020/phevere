<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phevere OCR region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: rgba(0, 0, 0, 0.25);
      user-select: none;
      font-family: system-ui, sans-serif;
    }
    #hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 2;
    }
    #box {
      position: fixed;
      border: 2px solid #5eb1ff;
      background: rgba(94, 177, 255, 0.15);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      display: none;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to select text region · Esc to cancel</div>
  <div id="box"></div>
  <script>
    (function () {
      const box = document.getElementById('box');
      let start = null;
      let dragging = false;

      function dipPoint(e) {
        // Overlay is fullscreen on one display; client coords ≈ DIP within that window.
        return { x: e.clientX, y: e.clientY };
      }

      function updateBox(a, b) {
        const x = Math.min(a.x, b.x);
        const y = Math.min(a.y, b.y);
        const w = Math.abs(a.x - b.x);
        const h = Math.abs(a.y - b.y);
        box.style.display = 'block';
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
        return { x, y, width: w, height: h };
      }

      window.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        dragging = true;
        start = dipPoint(e);
        updateBox(start, start);
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging || !start) return;
        updateBox(start, dipPoint(e));
      });

      window.addEventListener('mouseup', (e) => {
        if (!dragging || !start) return;
        dragging = false;
        const region = updateBox(start, dipPoint(e));
        start = null;
        if (region.width < 8 || region.height < 8) {
          if (window.ocrOverlayAPI) window.ocrOverlayAPI.cancel();
          return;
        }
        if (window.ocrOverlayAPI) window.ocrOverlayAPI.complete(region);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && window.ocrOverlayAPI) {
          window.ocrOverlayAPI.cancel();
        }
      });
    })();
  </script>
</body>
</html>
