<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phevere</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="main-window">
    <header class="titlebar" role="banner">
      <div class="titlebar-brand">
        <span class="titlebar-icon" aria-hidden="true">
          <svg class="titlebar-logo-svg" viewBox="0 0 1024 1024" width="22" height="22" focusable="false">
            <defs>
              <linearGradient id="phevereMarkBg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0B1220" />
                <stop offset="100%" stop-color="#152238" />
              </linearGradient>
              <linearGradient id="phevereMarkP" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3DDBC9" />
                <stop offset="100%" stop-color="#1FA896" />
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="220" ry="220" fill="url(#phevereMarkBg)" />
            <path fill="url(#phevereMarkP)" d="M300 220h280c140 0 250 90 250 230s-110 230-250 230H420v204c0 28-22 50-50 50h-20c-28 0-50-22-50-50V270c0-28 22-50 50-50zm120 140v200h150c70 0 120-45 120-100s-50-100-120-100H420z" />
            <circle cx="690" cy="340" r="42" fill="#E86A4A" />
          </svg>
        </span>
        <span class="titlebar-title">Phevere</span>
      </div>
      <div class="titlebar-end">
        <button type="button" id="settingsBtn" class="titlebar-gear" title="Settings" aria-label="Settings">
          <svg class="titlebar-gear-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7.6 7.6 0 0 1-2 1.2L14.8 21h-4l-.4-2.4a7.6 7.6 0 0 1-2-1.2l-2 .8-2-3.5 1.6-1.2a7.4 7.4 0 0 1 0-2.4L4.4 9.9l2-3.4 2 .7a7.6 7.6 0 0 1 2-1.2L10.8 3.6h4l.4 2.4a7.6 7.6 0 0 1 2 1.2l2-.8 2 3.5-1.6 1.2a7.4 7.4 0 0 1 0 2.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="window-controls" role="toolbar" aria-label="Window">
          <button type="button" id="minimize-btn" class="window-control window-control-minimize" title="Minimize" aria-label="Minimize">
            <svg class="window-control-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <!-- 2px bar, vertically centered in 16×16 -->
              <rect x="3" y="7" width="10" height="2" rx="0.5" fill="currentColor" />
            </svg>
          </button>
          <button type="button" id="maximize-btn" class="window-control window-control-maximize" title="Maximize" aria-label="Maximize">
            <svg class="window-control-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M4 4h8v8H4V4zm1 1v6h6V5H5z" />
            </svg>
          </button>
          <button type="button" id="close-btn" class="window-control window-control-close" title="Close" aria-label="Close">
            <svg class="window-control-icon window-control-icon--stroke" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="container main-shell">
      <section class="vocab-notebook" aria-labelledby="vocab-heading">
        <div class="recent-selections__header">
          <h2 id="vocab-heading" class="section-heading">Vocabulary notebook</h2>
          <div class="recent-selections__actions">
            <input type="search" id="vocabSearch" class="vocab-search" placeholder="Search notebook…" autocomplete="off" aria-label="Search notebook" />
            <div class="vocab-sort" role="group" aria-label="Notebook sort">
              <button type="button" id="vocabSortRecent" class="vocab-sort-btn is-active" aria-pressed="true">Recent</button>
              <button type="button" id="vocabSortAlpha" class="vocab-sort-btn" aria-pressed="false">A–Z</button>
            </div>
            <button type="button" id="exportVocabBtn" class="btn btn-outlined btn-small">Export</button>
            <button type="button" id="importVocabBtn" class="btn btn-outlined btn-small">Import</button>
            <button type="button" id="refreshVocabBtn" class="btn btn-outlined btn-small">Refresh</button>
          </div>
        </div>
        <div class="vocab-list-wrap" id="vocabListWrap">
          <div id="vocabList" class="selections-list">
            <p class="empty-message">No saved words yet.</p>
          </div>
          <nav class="vocab-az" id="vocabAz" hidden aria-label="Jump to letter"></nav>
          <div class="vocab-az-hud" id="vocabAzHud" hidden aria-hidden="true"></div>
        </div>
      </section>

      <section class="recent-selections" aria-labelledby="recent-heading">
        <div class="recent-selections__header">
          <h2 id="recent-heading" class="section-heading">Recent selections</h2>
          <div class="recent-selections__actions">
            <button type="button" id="clearSelectionsBtn" class="btn btn-outlined btn-small" style="display: none;">Clear all</button>
          </div>
        </div>
        <div id="selectionsList" class="selections-list">
          <p class="empty-message">No selections yet.</p>
        </div>
      </section>
    </main>

    <footer class="status-bar" role="group" aria-label="Monitoring toggles">
      <button type="button" id="selectionToggle" class="status-bar-item status-pill status-toggle" aria-pressed="true">
        <span class="status-label">Selection</span>
        <span id="selectionStatus" class="status-value running">On</span>
      </button>
      <button type="button" id="clipboardToggle" class="status-bar-item status-pill status-toggle" aria-pressed="true">
        <span class="status-label">Clipboard</span>
        <span id="clipboardStatus" class="status-value running">Running</span>
      </button>
      <button type="button" id="hoverToggle" class="status-bar-item status-pill status-toggle" aria-pressed="true">
        <span class="status-label">Hover</span>
        <span id="hoverStatus" class="status-value running">On</span>
      </button>
      <button type="button" id="audioToggle" class="status-bar-item status-pill status-toggle" aria-pressed="true">
        <span class="status-label">Audio</span>
        <span id="audioStatus" class="status-value running">On</span>
      </button>
      <button type="button" id="ocrStatusBtn" class="status-bar-item status-pill status-action" title="OCR region (Ctrl+Shift+O)">
        <span class="status-label">OCR</span>
        <span class="status-value">Region…</span>
      </button>
    </footer>
  </body>
</html>
