           document.addEventListener('click', function(e) {
             var t = e.target || null;
             if (t && typeof t.closest === 'function') {
               var ipaBtn = t.closest('.ipa-speak');
               if (ipaBtn) {
                 e.preventDefault();
                 e.stopPropagation();
                 playIpaChip(ipaBtn);
                 return;
               }
               var posTab = t.closest('.lexicon-pos-tab');
               if (posTab) {
                 e.preventDefault();
                 e.stopPropagation();
                 activateLexiconPos(posTab.getAttribute('data-pos') || '');
                 return;
               }
             }
             var anchor = null;
             if (t && typeof t.closest === 'function') {
               anchor = t.closest('a');
             }
             if (!anchor) return;
             e.preventDefault();
             e.stopPropagation();
             const lookupTerm = anchor.getAttribute('data-lookup') || '';
             let href = anchor.getAttribute('href') || '';
             let wikiTitle = '';
             if (lookupTerm) {
               wikiTitle = lookupTerm.trim();
             } else if (href) {
               const m =
                 href.match(/\/wiki\/([^?#]+)/i) ||
                 href.match(/^\/([^?#]+)$/);
               if (m && m[1]) {
                 try {
                   wikiTitle = decodeURIComponent(m[1].replace(/_/g, ' ')).replace(/#.*$/, '').trim();
                 } catch (_) {
                   wikiTitle = m[1].replace(/_/g, ' ').trim();
                 }
               }
             }
             // Prefer in-app dictionary lookup for wiki lemma / form-of targets
             if (wikiTitle && !/^(File|Category|Special|Wiktionary|Template|Appendix|Help|Module|User|Talk|Reconstruction):/i.test(wikiTitle)) {
               if (!isExpanded) expandToolbar();
               currentText = wikiTitle;
               activateTab('lexicon');
               lookupText(wikiTitle);
               return;
             }
             if (!href) return;
             if (href.startsWith('/')) {
               href = `https://en.wiktionary.org${href}`;
             }
             if (settings.openExternal) {
               window.electronAPI.openExternal(href);
             } else {
               window.electronAPI.openInApp(href);
             }
           });

           async function displayWikipediaResult(term) {
             const resultsContainer = document.getElementById('dictionary-results');
             const loading = document.getElementById('loadingElement');
             if (!resultsContainer) return;
             if (loading) {
               loading.style.display = 'block';
               showLoading({ title: 'Wikipedia…', subtitle: 'Fetching article summary' });
             }
             try {
               if (!window.wikipediaAPI) {
                 resultsContainer.innerHTML = `<div class="error-message">Wikipedia API unavailable.</div>`;
                 return;
               }
               const q = String(term || '').trim();
               if (!q) {
                 resultsContainer.innerHTML = `<div class="error-message">No query for Wikipedia.</div>`;
                 return;
               }
               const lang = (currentResult && currentResult.detectedLanguage) || 'en';
               const wikiLang = (lang === 'zh' || lang === 'ja' || lang === 'ko') ? lang : 'en';
               const result = await window.wikipediaAPI.search(q, wikiLang, 5);
               if (loading) loading.style.display = 'none';
               showDictionaryResults('flow');
               const items = (result && result.results) || [];

               function showList() {
                 var rsec = document.querySelector('.results-section');
                 if (rsec) rsec.classList.remove('is-reader');
                 showDictionaryResults('flow');
                 const html = `
                  <div class="wikipedia-card">
                    <div class="wikipedia-card__header">
                      <span>Wikipedia</span>
                      <span class="wikipedia-card__lang">${escapeHtml(wikiLang)}</span>
                    </div>
                    <div class="wikipedia-card__body">
                      ${items.map((r, i) => `
                        <div class="wikipedia-item" data-wiki-idx="${i}" role="button" tabindex="0">
                          <div class="wikipedia-item__title">
                            ${r.thumbnail ? `<img src="${escapeHtml(r.thumbnail)}" alt="" loading="lazy" onerror="this.remove()" />` : ''}
                            <span class="wikipedia-item__name">${escapeHtml(r.title)}</span>
                          </div>
                          <div class="wikipedia-item__extract">${escapeHtml(stripHtmlToText(r.extract || ''))}</div>
                        </div>
                      `).join('') || `<div class="error-message">No Wikipedia articles found.</div>`}
                    </div>
                  </div>`;
                 resultsContainer.innerHTML = html;
                 resultsContainer.querySelectorAll('.wikipedia-item').forEach((el) => {
                   const open = () => {
                     const idx = Number(el.getAttribute('data-wiki-idx'));
                     const item = items[idx];
                     if (item) showArticle(item);
                   };
                   el.addEventListener('click', open);
                   el.addEventListener('keydown', (e) => {
                     if (e.key === 'Enter' || e.key === ' ') {
                       e.preventDefault();
                       open();
                     }
                   });
                 });
               }

               function showArticle(item) {
                 const title = item.title || q;
                 const url = item.url || `https://${wikiLang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`;
                 var rsec = document.querySelector('.results-section');
                 if (rsec) rsec.classList.add('is-reader');
                 showDictionaryResults('fill');
                 resultsContainer.innerHTML = `
                  <div class="wikipedia-card wikipedia-reader">
                    <div class="wikipedia-reader__bar">
                      <button type="button" class="wikipedia-reader__back" id="wikiReaderBack" title="Back to results" aria-label="Back to results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                      <div class="wikipedia-reader__title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
                      <button type="button" class="wikipedia-reader__ext" id="wikiReaderExt" title="Open in browser" aria-label="Open in browser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>
                    <webview src="${escapeHtml(url)}" partition="persist:wikipedia" allowpopups></webview>
                  </div>`;
                 document.getElementById('wikiReaderBack')?.addEventListener('click', showList);
                 document.getElementById('wikiReaderExt')?.addEventListener('click', () => {
                   if (window.electronAPI && window.electronAPI.openExternal) {
                     window.electronAPI.openExternal(url);
                   } else if (window.electronAPI && window.electronAPI.send) {
                     window.electronAPI.send('open-wiki', title);
                   }
                 });
               }

               if (items.length === 1) {
                 showArticle(items[0]);
               } else {
                 showList();
               }
             } catch (err) {
               console.error('Wikipedia panel error', err);
               if (loading) loading.style.display = 'none';
               showDictionaryResults('flow');
               resultsContainer.innerHTML = `<div class="error-message">Wikipedia lookup failed.</div>`;
             }
           }

           async function showWikipediaPanel(term) {
             activateTab('wikipedia');
             await displayWikipediaResult(term);
           }

           var toastTimer = null;
           function showToast(msg) {
             var el = document.getElementById('pvToast');
             if (!el) {
               el = document.createElement('div');
               el.id = 'pvToast';
               el.className = 'pv-toast';
               el.setAttribute('role', 'status');
               document.body.appendChild(el);
             }
             el.textContent = msg;
             el.style.animation = 'none';
             void el.offsetWidth;
             el.style.animation = '';
             clearTimeout(toastTimer);
             toastTimer = setTimeout(function () { el.remove(); }, 1600);
           }
    </script>
  </body>
</html>
