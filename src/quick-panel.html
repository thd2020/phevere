<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick translation</title>
  <style>
    :root {
      --primary: #9c3d00;
      --tertiary: #0f6e71;
      --tertiary-container: #c5f0f1;
      --surface: #f4f0ea;
      --surface-lowest: #fffdf9;
      --surface-low: #eeeae4;
      --surface-high: #e3ded8;
      --on-surface: #1c1917;
      --on-surface-variant: #5c534e;
      --outline-variant: #d7c3bb;
      --hairline: rgb(28 25 23 / 0.1);
      --error: #ba1a1a;
      --font-ui: Outfit, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      --font-display: 'Source Serif 4 Variable', 'Source Serif 4', Georgia, serif;
      --motion: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--surface); }
    body {
      font: 14px/1.4 var(--font-ui);
      color: var(--on-surface);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .qp { display: flex; flex-direction: column; box-shadow: inset 0 0 0 1px var(--hairline); }
    .qp-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--surface-high);
      -webkit-app-region: drag;
    }
    .qp-bar select, .qp-bar button { -webkit-app-region: no-drag; }
    .qp-lang {
      min-width: 0;
      flex: 0 1 auto;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
      background: var(--surface-lowest);
      font: 500 13px/1 var(--font-ui);
      color: var(--on-surface);
    }
    .qp-swap {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      transition: background-color 0.14s var(--motion);
    }
    .qp-swap:hover { background: var(--surface-low); }
    .qp-swap svg { width: 16px; height: 16px; }
    .qp-source {
      padding: 10px 14px 8px;
      color: var(--on-surface-variant);
      font: 13px/1.45 var(--font-ui);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .qp-list { list-style: none; padding: 0 6px 6px; max-height: 320px; overflow-y: auto; }
    .qp-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .qp-item + .qp-item { margin-top: 2px; }
    .qp-item.is-active { background: var(--surface-lowest); box-shadow: inset 0 0 0 1.5px var(--tertiary); }
    .qp-item__name { font: 600 11px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-surface-variant); }
    .qp-item.is-active .qp-item__name { color: var(--tertiary); }
    .qp-item__text {
      font: 15px/1.45 var(--font-display);
      color: var(--on-surface);
      user-select: text;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .qp-item__text.is-wait { color: var(--on-surface-variant); font-family: var(--font-ui); font-size: 13px; }
    .qp-item__text.is-error { color: var(--error); font-family: var(--font-ui); font-size: 13px; }
    .qp-keys {
      display: flex;
      gap: 12px;
      padding: 7px 14px 9px;
      border-top: 1px solid var(--hairline);
      color: var(--on-surface-variant);
      font: 12px/1 var(--font-ui);
    }
    .qp-keys kbd {
      display: inline-block;
      min-width: 18px;
      margin-right: 4px;
      padding: 2px 5px;
      border: 1px solid var(--outline-variant);
      border-radius: 5px;
      background: var(--surface-lowest);
      font: 500 11px/1.2 var(--font-ui);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="qp" id="qp">
    <div class="qp-bar">
      <select id="qpFrom" class="qp-lang" aria-label="Translate from"></select>
      <button type="button" id="qpSwap" class="qp-swap" aria-label="Swap languages" title="Swap languages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <select id="qpTo" class="qp-lang" aria-label="Translate to"></select>
    </div>
    <p class="qp-source" id="qpSource"></p>
    <ul class="qp-list" id="qpList" role="listbox" aria-label="Translations" tabindex="0"></ul>
    <div class="qp-keys" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd>Engine</span>
      <span><kbd>Enter</kbd>Replace</span>
      <span><kbd>Esc</kbd>Cancel</span>
    </div>
  </div>
</body>
</html>
